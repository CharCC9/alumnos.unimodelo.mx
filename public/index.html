<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-wrapper">
                <img src="mi-logotipo.png" alt="Logotipo Institucional" class="login-logo">
            </div>
            <h2>SERVICIOS ESCOLARES</h2>
        </div>
        
        <form action="/login" method="POST" class="login-form">
            
            <div class="input-container-modern">
                <span class="modern-icon">👤</span>
                <div class="input-field-wrapper">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Ej. 20261234">
                </div>
            </div>
            
            <div class="input-container-modern">
                <span class="modern-icon">🔒</span>
                <div class="input-field-wrapper">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Contraseña">
                </div>
            </div>
            
            <button type="submit" class="btn-submit">INGRESAR</button>
        </form>
        
        <div class="extra-buttons-container">
            <a href="#" class="btn-secondary">SERVICIO SOCIAL</a>
            <a href="#" class="btn-secondary">NUEVO INGRESO</a>
        </div>
        
        <div class="login-footer">
            <p><a href="#">Olvide mi contraseña</a></p>
        </div>
    </div>
</body>
</html>
