<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Portal de Alumnos</h2>
            <p>Ingresa tus credenciales para acceder al sistema escolar</p>
        </div>
        
        <!-- El formulario envía los datos a la ruta /login del servidor -->
        <form action="/login" method="POST" class="login-form">
            <div class="input-group">
                <label for="username">Matrícula o Nombre de Usuario</label>
                <input type="text" id="username" name="username" required placeholder="Ej. 20261234">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        
        <div class="login-footer">
            <p><a href="#">¿Olvidaste tu contraseña o usuario?</a></p>
            <small>⚠️ Nota: Este sitio es una simulación con fines puramente académicos.</small>
        </div>
    </div>
</body>
</html>
