<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-wrapper">
                <img src="mi-logotipo.png" alt="Logotipo Institucional" class="login-logo">
            </div>
            <h2>SERVICIOS ESCOLARES</h2>
        </div>
        
        <form action="/login" method="POST" class="login-form">
            <div class="row">
                <div class="input-field col s12">
                    <i class="material-icons prefix">person</i>
                    <input id="username" class="validate" maxlength="50" name="username" type="text" required>
                    <label for="username">Usuario</label>
                </div>
                
                <div class="input-field col s12">
                    <i class="material-icons prefix">lock</i>
                    <input id="password" class="validate" maxlength="50" name="password" type="password" required>
                    <label for="password">Contraseña</label>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">INGRESAR</button>
        </form>
        
        <div class="extra-buttons-container">
            <a href="#" class="btn-secondary">SERVICIO SOCIAL</a>
            <a href="#" class="btn-secondary">NUEVO INGRESO</a>
        </div>
        
        <div class="login-footer">
            <p><a href="#">Olvide mi contraseña</a></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
